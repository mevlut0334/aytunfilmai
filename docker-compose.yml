services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aytunfilmai_dev_app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
    networks:
      - aytunfilmai_dev

  nginx:
    image: nginx:alpine
    container_name: aytunfilmai_dev_nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/dev.conf:/etc/nginx/conf.d/default.conf
    networks:
      - aytunfilmai_dev
    depends_on:
      - app

  mysql:
    image: mysql:8.0
    container_name: aytunfilmai_dev_mysql
    restart: unless-stopped
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: aytunfilmai_dev
      MYSQL_USER: aytunfilmai
      MYSQL_PASSWORD: secret
    volumes:
      - mysql_dev_data:/var/lib/mysql
    networks:
      - aytunfilmai_dev

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: aytunfilmai_dev_phpmyadmin
    restart: unless-stopped
    ports:
      - "8081:80"
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_USER: root
      PMA_PASSWORD: root
    networks:
      - aytunfilmai_dev
    depends_on:
      - mysql

volumes:
  mysql_dev_data:
    driver: local

networks:
  aytunfilmai_dev:
    driver: bridge
